<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">
  <div id="root"></div>

  <script>
    (function () {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        // Sudah berjalan di dalam Apps Script asli (dibuka lewat URL .../exec bawaan
        // Apps Script) - google.script.run bawaan dipakai apa adanya, shim ini dilewati.
        return;
      }

      // ================================================================================
      // SHIM google.script.run UNTUK HOSTING DI LUAR APPS SCRIPT (mis. GitHub + Vercel)
      // --------------------------------------------------------------------------------
      // Saat aplikasi ini dijalankan DI DALAM Google Apps Script, objek `google.script.run`
      // disediakan otomatis oleh Google untuk memanggil fungsi di code.gs. Karena aplikasi
      // ini di-hosting terpisah (statis) di Vercel, objek itu TIDAK PERNAH ada di browser -
      // akibatnya kode di bawah selalu mengira "tidak terhubung ke backend" dan menampilkan
      // data demo/dummy, walau data & filter tanggal di code.gs sudah benar.
      //
      // Shim ini MENIRU PERSIS cara pakai google.script.run (withSuccessHandler,
      // withFailureHandler, lalu panggil nama fungsi apa pun) tapi di baliknya memakai
      // fetch() ke Web App Apps Script yang sudah di-deploy sebagai API JSON (lihat
      // doPost() di code.gs). Dengan begini, SELURUH kode React di file ini yang memanggil
      // google.script.run.withSuccessHandler(...).getSiswaList() dst. TIDAK PERLU diubah -
      // hanya URL di bawah ini yang perlu diisi sesuai deployment Anda.
      // ================================================================================

      // *** WAJIB DIISI ***: URL Web App Apps Script Anda (Deploy > Manage deployments >
      // salin URL yang berakhiran "/exec"). Tanpa ini, aplikasi tetap akan memakai data demo.
      var SIPIKET_API_URL = "https://script.google.com/macros/s/AKfycbyAjOHFBTFiqBt_nMVW38-j-JR-VLEYqYttfIDVJCPjRJ0UVQSDNrKnys6Qy27026M7bg/exec";

      function callAppsScript_(fnName, args, onSuccess, onFailure) {
        fetch(SIPIKET_API_URL, {
          method: 'POST',
          // PENTING: pakai 'text/plain' (bukan 'application/json') supaya browser TIDAK
          // mengirim preflight request OPTIONS - Apps Script Web App tidak bisa menjawab
          // preflight itu, jadi kalau pakai 'application/json' permintaan akan gagal
          // diblokir CORS. code.gs tetap mem-parse isinya sebagai JSON secara manual.
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn: fnName, args: args })
        })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (json && json.success) {
              if (onSuccess) onSuccess(json.result);
            } else {
              var msg = (json && json.error) || 'Terjadi kesalahan pada server.';
              if (onFailure) onFailure(msg); else console.error('SI-PIKET API error (' + fnName + '):', msg);
            }
          })
          .catch(function (err) {
            if (onFailure) onFailure(err && err.message ? err.message : String(err));
            else console.error('SI-PIKET API gagal terhubung (' + fnName + '):', err);
          });
      }

      function makeRunner_() {
        var successHandler = null;
        var failureHandler = null;
        var proxy = new Proxy({
          withSuccessHandler: function (fn) { successHandler = fn; return proxy; },
          withFailureHandler: function (fn) { failureHandler = fn; return proxy; },
          withUserObject: function () { return proxy; }
        }, {
          get: function (target, prop) {
            if (prop in target) return target[prop];
            return function () {
              callAppsScript_(prop, Array.prototype.slice.call(arguments), successHandler, failureHandler);
              return proxy;
            };
          }
        });
        return proxy;
      }

      window.google = window.google || {};
      window.google.script = window.google.script || {};
      // "run" dibuat sebagai getter supaya SETIAP kali "google.script.run" diakses (mis. dua
      // pemanggilan berbeda seperti .withSuccessHandler(a).getX() dan .withSuccessHandler(b).getY()
      // yang dijalankan berurutan), masing-masing mendapat runner BARU dengan successHandler-nya
      // sendiri - tidak saling menimpa satu sama lain.
      Object.defineProperty(window.google.script, 'run', {
        get: function () { return makeRunner_(); },
        configurable: true
      });
    })();
  </script>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;


    // === Helper Tanggal Lokal (WIB) ===
    const pad2_ = (n) => String(n).padStart(2, '0');
    const getLocalDateStr_ = (d = new Date()) =>
      `${d.getFullYear()}-${pad2_(d.getMonth() + 1)}-${pad2_(d.getDate())}`;
    const parseLocalDateStr_ = (dateStr) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    };

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const signSlipParam = urlParams.get('signSlip');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [filterDate, setFilterDate] = useState(getLocalDateStr_());
      const [currentDateTime, setCurrentDateTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentDateTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);
      
      const [classes, setClasses] = useState([]);
      const [permissions, setPermissions] = useState([]);
      const [journals, setJournals] = useState([]);
      const [siswaList, setSiswaList] = useState([]);
      const [guruList, setGuruList] = useState([]);
      const [selectedGuru, setSelectedGuru] = useState('Guru Piket');

      // --- LOGIC ROTASI GURU PIKET OTOMATIS BERDASARKAN JAM ---
      useEffect(() => {
        if (guruList.length > 0) {
          const updatePiketTeacher = () => {
             const now = new Date();
             const currentDayIndex = now.getDay(); 
             const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
             const currentDayName = days[currentDayIndex];
             
             // Cari semua guru yang jadwalnya hari ini
             const availableTeachersToday = guruList.filter(g => g.hari.toLowerCase() === currentDayName.toLowerCase());
             
             if (availableTeachersToday.length > 0) {
               const currentHour = now.getHours();
               // Membagi guru piket secara bergiliran berdasarkan jam saat ini
               const teacherIndex = currentHour % availableTeachersToday.length;
               const autoSelectedTeacher = availableTeachersToday[teacherIndex].nama;
               
               setSelectedGuru(prev => prev !== autoSelectedTeacher ? autoSelectedTeacher : prev);
             } else {
               setSelectedGuru('Guru Piket');
             }
          };

          // Panggil langsung saat mounted / perubahan daftar guru
          updatePiketTeacher();
          // Set interval cek setiap menit
          const intervalId = setInterval(updatePiketTeacher, 60000); 

          return () => clearInterval(intervalId);
        }
      }, [guruList]);

      const [notifOrtuList, setNotifOrtuList] = useState([]);
      const [selectedKelasNotif, setSelectedKelasNotif] = useState('Semua');
      const [missingContacts, setMissingContacts] = useState([]);

      const [selectedClassDetail, setSelectedClassDetail] = useState(null);
      const [newStudentAttendance, setNewStudentAttendance] = useState({ name: '', status: 'Terlambat', notes: '' });

      const initialPermissionState = { studentName: '', class: '', type: 'Izin Pulang', reason: '', nis: '', mapelTeacher: '', gender: 'Laki-laki', noHpOrtu: '' };
      const [newPermission, setNewPermission] = useState(initialPermissionState);
      const [isNewStudentMode, setIsNewStudentMode] = useState(false); 
      
      const [newJournal, setNewJournal] = useState({ category: 'Umum', content: '' });
      
      // Modal Controls
      const [showPermModal, setShowPermModal] = useState(false);
      const [previewPermModal, setPreviewPermModal] = useState(null);
      const [printPreviewModal, setPrintPreviewModal] = useState(null);
      const [mobileSignSlip, setMobileSignSlip] = useState(null);
      const [mobileSignRole, setMobileSignRole] = useState('guru_mapel');
      const [directSignTarget, setDirectSignRole] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [siswaSearchInput, setSiswaSearchInput] = useState('');
      const [filteredSiswaSuggestions, setFilteredSiswaSuggestions] = useState([]);
      
      const [isLoading, setIsLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      // Rekap PDF Export States
      const [rekapMode, setRekapMode] = useState('mingguan');
      const [rekapInputDate, setRekapInputDate] = useState(getLocalDateStr_());
      const [rekapInputMonth, setRekapInputMonth] = useState(getLocalDateStr_().slice(0,7));
      const [rekapSelectedClass, setRekapSelectedClass] = useState('Semua');
      const [rekapData, setRekapData] = useState([]);
      const [isFetchingRekap, setIsFetchingRekap] = useState(false);
      const [rekapInfoText, setRekapInfoText] = useState('');

      const signaturePadRef = useRef(null);
      const canvasRef = useRef(null);
      const directPadRef = useRef(null);
      const directCanvasRef = useRef(null);

      const triggerPrintSlip = (perm) => {
        setPrintPreviewModal(perm);
      };
      
      const executeBrowserPrint = () => {
        setTimeout(() => { window.print(); }, 200);
      };

      const formattedLiveDate = useMemo(() => currentDateTime.toLocaleDateString('id-ID', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }), [currentDateTime]);

      const formattedLiveTime = useMemo(() => currentDateTime.toLocaleTimeString('id-ID', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }), [currentDateTime]);

      const uniqueClasses = useMemo(() => {
        const clsSet = new Set();
        siswaList.forEach(s => { if (s.kelas) clsSet.add(s.kelas) });
        classes.forEach(c => { if (c.name) clsSet.add(c.name) });
        return Array.from(clsSet).sort();
      }, [siswaList, classes]);

      const loadAllData = (dateTarget, isBackground = false) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          if (!isBackground) setIsLoading(true);
          
          google.script.run.withSuccessHandler(data => { if (data) setSiswaList(data); }).getSiswaList();
          google.script.run.withSuccessHandler(data => {
            if (data && data.length > 0) setGuruList(data);
          }).getGuruList();
          
          google.script.run.withSuccessHandler(data => {
            if (data) setPermissions(data);
            if (!isBackground) setIsLoading(false);
          }).getPermissions(dateTarget);
          
          google.script.run.withSuccessHandler(data => { if (data) setClasses(data); }).getAbsensiKelas(dateTarget);
          google.script.run.withSuccessHandler(data => { if (data) setJournals(data); }).getJournals();
          google.script.run.withSuccessHandler(data => { if (data) setNotifOrtuList(data); }).getNotifikasiOrangTua(dateTarget, selectedKelasNotif);
          google.script.run.withSuccessHandler(data => { if (data) setMissingContacts(data); }).getMissingAttendanceContacts(dateTarget);
        } else {
            // Mock data untuk keperluan preview jika Google Apps Script tidak terdeteksi
            setIsLoading(true);
            setTimeout(() => {
                // Menyiapkan data Guru lengkap agar fungsi rotasi bisa berjalan pada hari apapun di saat preview.
                setGuruList([
                    {nama: "Budi Santoso, M.Pd", hari: "Senin"}, {nama: "Siti Aminah, S.Pd", hari: "Senin"},
                    {nama: "Rahman Hakim, S.Kom", hari: "Selasa"}, {nama: "Dina Mariana, S.Pd", hari: "Selasa"},
                    {nama: "Umar Bakri, S.Pd", hari: "Rabu"}, {nama: "Nia Ramadhani, S.Pd", hari: "Rabu"},
                    {nama: "Bapak Kamis Pertama", hari: "Kamis"}, {nama: "Ibu Kamis Kedua", hari: "Kamis"}, // Ditambah untuk tes hr Kamis
                    {nama: "Ahmad Jaelani, S.Ag", hari: "Jumat"}
                ]);
                setSiswaList([
                    {nis: "1234", nama: "Andi Saputra", kelas: "X-A", gender: "Laki-laki", noHpOrtu: "081234"},
                    {nis: "1235", nama: "Budi Doremi", kelas: "X-B", gender: "Laki-laki", noHpOrtu: "081235"},
                ]);
                setPermissions([
                    {id: 1, slipNumber: "PKT/20231026/001", studentName: "Andi Saputra", class: "X-A", type: "Izin Pulang", reason: "Sakit", time: "09:00", timeIn: "-", status: "Disetujui", piketTeacher: "Budi Santoso", mapelTeacher: "Siti Aminah", date: filterDate}
                ]);
                setClasses([
                    {id: 1, name: "X-A", total: 30, present: 28, sick: 1, leave: 0, absent: 1, late: 0, earlyLeave: 0, students: [{name: "Andi Saputra", status: "Sakit", notes: "Demam", noHpOrtu: "081234"}, {name: "Bagas", status: "Alfa", notes: "", noHpOrtu: "-"}]},
                    {id: 2, name: "X-B", total: 32, present: 32, sick: 0, leave: 0, absent: 0, late: 2, earlyLeave: 0, students: []}
                ]);
                setNotifOrtuList([
                    {nisn: "1234", name: "Andi Saputra", kelas: "X-A", status: "SAKIT", notes: "Demam", noHpOrtu: "081234", waUrl: "#"}
                ]);
                setMissingContacts([
                    {name: "Ketua Kelas XI-A", role: "Ketua", kelas: "XI-A", phone: "08999", waUrl: "#"}
                ]);
                setIsLoading(false);
            }, 1000);
        }
      };

      useEffect(() => {
        loadAllData(filterDate, false);
        // Auto-refresh tampilan tiap 30 detik - hanya menampilkan ulang data yang sudah ada
        // di sheet lokal (Absensi_Kelas + sheet per kelas absen_<KELAS>), tidak mengakses
        // spreadsheet sumber. Data di sheet lokal itu sendiri diperbarui oleh trigger
        // auto-import di backend (lihat menu "SI-PIKET Admin" > Aktifkan Auto-Import).
        const autoRefreshInterval = setInterval(() => loadAllData(filterDate, true), 30000);
        return () => clearInterval(autoRefreshInterval);
      }, [filterDate, selectedKelasNotif]);

      useEffect(() => {
        if (signSlipParam) {
          const found = permissions.find(p => p.slipNumber === signSlipParam);
          if (found) setMobileSignSlip(found);
          else {
            setMobileSignSlip({
              slipNumber: signSlipParam, studentName: 'Siswa Piket', class: 'Kelas', type: 'Izin Keluar / Pulang',
              reason: 'Permohonan Izin Resmi Sekolah', time: '08:00', mapelTeacher: 'Guru Mata Pelajaran', date: filterDate
            });
          }
        }
      }, [signSlipParam, permissions]);

      useEffect(() => {
        if (previewPermModal) {
          const qrContainer = document.getElementById('qrcode-container');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            let baseUrl = window.location.href.split('?')[0];
            if (!baseUrl || baseUrl === 'about:blank' || baseUrl.includes('googleusercontent.com')) baseUrl = window.location.origin + window.location.pathname;
            const targetSignUrl = `${baseUrl}?signSlip=${encodeURIComponent(previewPermModal.slipNumber)}`;
            try {
              new QRCode(qrContainer, { text: targetSignUrl, width: 120, height: 120, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
            } catch (err) {
              const qrImg = document.createElement('img');
              qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(targetSignUrl)}`;
              qrImg.alt = "QR Code Tanda Tangan";
              qrImg.className = "w-28 h-28 object-contain rounded-lg border border-slate-200";
              qrContainer.appendChild(qrImg);
            }
          }
        }
      }, [previewPermModal]);

      useEffect(() => {
        if (mobileSignSlip && canvasRef.current) signaturePadRef.current = new SignaturePad(canvasRef.current, { backgroundColor: 'rgb(255, 255, 255)', penColor: 'rgb(15, 23, 42)' });
      }, [mobileSignSlip]);

      useEffect(() => {
        if (directSignTarget && directCanvasRef.current) directPadRef.current = new SignaturePad(directCanvasRef.current, { backgroundColor: 'rgb(255, 255, 255)', penColor: 'rgb(15, 23, 42)' });
      }, [directSignTarget]);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 4000); };

      const handleFetchRekapData = () => {
        setIsFetchingRekap(true);
        let startDate, endDate, info;
        
        if (rekapMode === 'mingguan') {
          const d = parseLocalDateStr_(rekapInputDate);
          const day = d.getDay() || 7; 
          if(day !== 1) d.setDate(d.getDate() - (day - 1));
          startDate = getLocalDateStr_(d);
          d.setDate(d.getDate() + 4);
          endDate = getLocalDateStr_(d);
          info = `Menampilkan rekap mingguan dari Senin, ${startDate} s/d Jumat, ${endDate} | Kelas: ${rekapSelectedClass}`;
        } else {
          const [year, month] = rekapInputMonth.split('-');
          startDate = `${year}-${month}-01`;
          const lastDay = new Date(year, parseInt(month), 0).getDate();
          endDate = `${year}-${month}-${lastDay}`;
          info = `Menampilkan rekap bulanan untuk bulan ${month}-${year} | Kelas: ${rekapSelectedClass}`;
        }

        setRekapInfoText(info);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler((data) => {
            setRekapData(data || []);
            setIsFetchingRekap(false);
            if(data && data.length > 0) showToast("Data rekap berhasil ditarik!");
            else showToast("Tidak ada data pada periode dan kelas ini.");
          }).getBulkRekap(startDate, endDate, rekapSelectedClass);
        } else {
          setTimeout(() => {
            setRekapData([
                {kelas: "X-A", nis: "1234", nama: "Andi Saputra", hadir: 4, sakit: 1, izin: 0, alfa: 0, dispen: 0, terlambat: 0, pulang_cepat: 0, persentase: "80.0%"}
            ]);
            setIsFetchingRekap(false);
            showToast("Pratinjau data rekap berhasil dimuat!");
          }, 1000);
        }
      };

      const handleDownloadPDF = () => {
        if (!rekapData || rekapData.length === 0) {
          showToast("Data kosong, tidak ada yang bisa di-download.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'a4');
        
        const safeClassName = rekapSelectedClass === 'Semua' ? 'Semua Kelas' : rekapSelectedClass;
        const periodText = rekapMode === 'mingguan' ? `Periode Mingguan: ${rekapInputDate}` : `Periode Bulan: ${rekapInputMonth}`;

        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("REKAPITULASI ABSENSI SISWA - SMAN 1 PARUNG", 40, 40);
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`Kelas: ${safeClassName}`, 40, 60);
        doc.text(periodText, 40, 75);

        const tableColumn = ["No", "Kelas", "NIS", "Nama Siswa", "Hadir", "Sakit", "Izin", "Alfa", "Dispen", "Lambat", "Plg Cpt", "% Hadir"];
        const tableRows = [];

        rekapData.forEach((row, index) => {
          const rowData = [
            index + 1,
            row.kelas,
            row.nis,
            row.nama,
            row.hadir,
            row.sakit,
            row.izin,
            row.alfa,
            row.dispen,
            row.terlambat,
            row.pulang_cepat,
            row.persentase
          ];
          tableRows.push(rowData);
        });

        doc.autoTable({
          head: [tableColumn],
          body: tableRows,
          startY: 90,
          theme: 'grid',
          styles: { fontSize: 8, cellPadding: 4 },
          headStyles: { fillColor: [79, 70, 229] }, 
          alternateRowStyles: { fillColor: [248, 250, 252] } 
        });

        const fileName = `Rekap_Absensi_${safeClassName.replace(/[^a-zA-Z0-9]/g, '_')}_${rekapMode}.pdf`;
        doc.save(fileName);
        showToast("File PDF berhasil di-download!");
      };

      const handleSiswaSearchChange = (val) => {
        setSiswaSearchInput(val);
        setNewPermission(prev => ({ ...prev, studentName: val }));
        if (val.trim() === '') { setFilteredSiswaSuggestions([]); return; }
        const filtered = siswaList.filter(s => (s.nama && s.nama.toLowerCase().includes(val.toLowerCase())) || (s.nis && s.nis.includes(val))).slice(0, 5);
        setFilteredSiswaSuggestions(filtered);
      };

      const selectSiswaSuggestion = (siswa) => {
        setNewPermission({ ...newPermission, studentName: siswa.nama, class: siswa.kelas, nis: siswa.nis });
        setSiswaSearchInput(siswa.nama);
        setFilteredSiswaSuggestions([]);
      };

      const getNextQueueOrderAndSlip = () => {
        const now = new Date();
        const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const todayPrefix = `PKT/${dateStr}/`;
        const todaySlips = permissions.filter(p => p.slipNumber && p.slipNumber.startsWith(todayPrefix));
        let nextOrder = 1;
        if (todaySlips.length > 0) {
          const numbers = todaySlips.map(p => { const parts = p.slipNumber.split('/'); return parseInt(parts[2], 10) || 0; });
          nextOrder = Math.max(...numbers) + 1;
        }
        return { queueOrder: nextOrder, slipNumber: `${todayPrefix}${String(nextOrder).padStart(3, '0')}` };
      };

      const handleAddStudentAttendanceToClass = (e) => {
        e.preventDefault();
        if (!selectedClassDetail || !newStudentAttendance.name) return;
        let targetUpdatedObj = null;
        const updatedClasses = classes.map(c => {
          if (c.id === selectedClassDetail.id || c.name === selectedClassDetail.name) {
            const currentStudents = c.students || [];
            const updatedStudents = [...currentStudents, { ...newStudentAttendance }];
            let absent = 0, sick = 0, leave = 0, late = 0, earlyLeave = 0;
            updatedStudents.forEach(st => {
              const stStatus = (st.status || "").toLowerCase();
              if (stStatus.includes('alfa') || stStatus.includes('alpha') || stStatus.includes('alpa')) absent++;
              else if (stStatus.includes('sakit')) sick++;
              else if (stStatus.includes('izin') || stStatus.includes('ijin')) leave++;
              else if (stStatus.includes('terlambat')) late++;
              else if (stStatus.includes('pulang cepat')) earlyLeave++;
            });
            targetUpdatedObj = { ...c, date: filterDate, total: updatedStudents.length, absent, sick, leave, late, earlyLeave, present: 0, students: updatedStudents };
            setSelectedClassDetail(targetUpdatedObj);
            return targetUpdatedObj;
          }
          return c;
        });
        setClasses(updatedClasses);
        if (typeof google !== 'undefined' && google.script && google.script.run && targetUpdatedObj) {
          google.script.run.saveAbsensiKelas(targetUpdatedObj);
          google.script.run.withSuccessHandler(data => { if (data) setNotifOrtuList(data); }).getNotifikasiOrangTua(filterDate, selectedKelasNotif);
        }
        setNewStudentAttendance({ name: '', status: 'Terlambat', notes: '' });
        showToast("Catatan ketidakhadiran siswa berhasil disimpan!");

      const handleApprovePermission = (id) => {

        setIsLoading(true);
        const updatedPerm = { ...perm, status: "Disetujui" };

          google.script.run.withSuccessHandler((res) => {
            if (res.success) {
              setPermissions(prev => prev.map(p => p.id === id ? updatedPerm : p));

              showToast("Status perizinan disetujui!");
            }
            setIsLoading(false);
          }).savePermission(updatedPerm);
        } else {
          setPermissions(prev => prev.map(p => p.id === id ? updatedPerm : p));
          if (previewPermModal && previewPermModal.id === id) setPreviewPermModal(prev => ({ ...prev, status: 'Disetujui' }));
          showToast("Status perizinan disetujui!");
          setIsLoading(false);
        }
      };

      const handleRejectPermission = (id) => {

            setIsLoading(false);
          }).savePermission(updatedPerm);

          setPermissions(prev => prev.map(p => p.slipNumber === slipNumber ? { ...p, status: 'Kembali', timeIn: timeIn } : p));

          setIsLoading(false);

      const handleAddPermission = (e) => {

          date: filterDate,
          signature: null, signatureMapel: null
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler((res) => {
            if (res.success) {
              setPermissions([newRecord, ...permissions]);

          setIsLoading(false);

      const handleAddJournal = (e) => {

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler((res) => {
            if (res.success) {
              setJournals([newLog, ...journals]);
              setNewJournal({ category: 'Umum', content: '' });
              showToast("Catatan jurnal berhasil disimpan!");

            setIsLoading(false);

          setJournals([newLog, ...journals]);

          setIsLoading(false);

        if (typeof google !== 'undefined' && google.script && google.script.run) google.script.run.saveLogPesanOrangTua(item);
        showToast(`Membuka WhatsApp untuk mengirim pesan ke Orang Tua ${item.name}`);

      const handleSendAllPesanOrtu = async () => {
        const validItems = filteredNotifOrtu.filter(item => item.waUrl && item.waUrl !== "#");
        if (validItems.length === 0) { alert("Tidak ada nomor WhatsApp orang tua yang valid."); return; }
        if (!window.confirm(`Anda akan mengirim pesan massal ke ${validItems.length} orang tua.\nPastikan Anda SUDAH MENGIZINKAN POP-UP BROWSER.\nLanjutkan?`)) return;

        setIsLoading(true);
        for (let i = 0; i < validItems.length; i++) {
          const item = validItems[i];
          showToast(`Memproses pesan ke-${i + 1} dari ${validItems.length} (${item.name})...`);
          window.open(item.waUrl, '_blank');
          if (typeof google !== 'undefined' && google.script && google.script.run) google.script.run.saveLogPesanOrangTua(item);
          await new Promise(resolve => setTimeout(resolve, 2000));

        setIsLoading(false);
        showToast("Proses pengiriman pesan WhatsApp massal telah selesai!");
      };

      const handleSendAllPesanPengurus = async () => {
        const validItems = missingContacts.filter(item => item.waUrl && item.waUrl !== "#");

        setIsLoading(true);
        for (let i = 0; i < validItems.length; i++) {
          const item = validItems[i];
          showToast(`Mengirim peringatan ke-${i + 1} dari ${validItems.length} (${item.kelas})...`);
          window.open(item.waUrl, '_blank');
          await new Promise(resolve => setTimeout(resolve, 2000));
        }
        setIsLoading(false);
        showToast("Peringatan tagihan absensi selesai dikirim!");

        const signatureDataUrl = signaturePadRef.current.toDataURL();
        setIsLoading(true);
        let updatedObj = null;
        setPermissions(prev => prev.map(p => {
          if (p.slipNumber === mobileSignSlip.slipNumber) {
            if (mobileSignRole === 'guru_mapel') updatedObj = { ...p, signatureMapel: signatureDataUrl };
            else updatedObj = { ...p, signature: signatureDataUrl, status: 'Disetujui' };
            return updatedObj;
          }
          return p;
        }));
        if (typeof google !== 'undefined' && google.script && google.script.run && updatedObj) google.script.run.savePermission(updatedObj);
        
        setTimeout(() => {
          setIsLoading(false);
          alert('Tanda Tangan Terkirim!');
          window.history.replaceState({}, document.title, window.location.pathname);
          setMobileSignSlip(null);
        }, 800);
      };

      const handleSaveDirectSignature = () => {
        if (!directPadRef.current || directPadRef.current.isEmpty()) { alert('Silakan bubuhkan tanda tangan!'); return; }

        const { role, perm } = directSignTarget;
        let updatedObj = null;
        setPermissions(prev => prev.map(p => {
          if (p.id === perm.id) {
            if (role === 'guru_mapel') updatedObj = { ...p, signatureMapel: sigDataUrl };
            else updatedObj = { ...p, signature: sigDataUrl, status: 'Disetujui' };
            return updatedObj;
          }
          return p;
        }));
        if (typeof google !== 'undefined' && google.script && google.script.run && updatedObj) google.script.run.savePermission(updatedObj);
        if (previewPermModal && previewPermModal.id === perm.id) {
          setPreviewPermModal(prev => {
            if (role === 'guru_mapel') return { ...prev, signatureMapel: sigDataUrl };
            else return { ...prev, signature: sigDataUrl, status: 'Disetujui' };
          });
        }
        showToast(`Tanda tangan disimpan!`);
        setDirectSignRole(null);
      };

      const clearSignatureCanvas = () => { if (signaturePadRef.current) signaturePadRef.current.clear(); };
      const clearDirectCanvas = () => { if (directPadRef.current) directPadRef.current.clear(); };

          totalLeave += c.leave || 0; totalLate += c.late || 0; totalEarlyLeave += c.earlyLeave || 0;
        });
        const pendingPerms = permissions.filter(p => p.status === 'Menunggu').length;
        const approvedPerms = permissions.filter(p => p.status === 'Disetujui' || p.status === 'Kembali').length;
        return { totalPresent, totalAbsent, totalSick, totalLeave, totalLate, totalEarlyLeave, pendingPerms, approvedPerms };
      }, [classes, permissions]);

      const filteredPermissions = useMemo(() => {
        return permissions.filter(p => 
          (p.studentName && p.studentName.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (p.class && p.class.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (p.slipNumber && p.slipNumber.toLowerCase().includes(searchQuery.toLowerCase()))
        );
      }, [permissions, searchQuery]);

      const filteredNotifOrtu = useMemo(() => {
        if (selectedKelasNotif === 'Semua') return notifOrtuList;
        return notifOrtuList.filter(n => n.kelas === selectedKelasNotif);
      }, [notifOrtuList, selectedKelasNotif]);


      // -------------- RENDER AREA -------------- //

      if (mobileSignSlip) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 p-4 flex flex-col items-center justify-center">
            <div className="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 space-y-5">
              <div className="text-center border-b border-slate-700 pb-4">
                <div className="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
                  <i className="fa-solid fa-signature"></i>
                </div>
                <h2 className="text-lg font-extrabold text-white">Konfirmasi Tanda Tangan Digital</h2>
                <p className="text-xs text-slate-400">SI-PIKET PERIZINAN SISWA</p>
              </div>

              <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/60 text-xs space-y-2">
                <div className="flex justify-between"><span className="text-slate-400">No. Slip:</span><span className="font-mono font-bold text-amber-400">{mobileSignSlip.slipNumber}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Siswa:</span><span className="font-bold text-white">{mobileSignSlip.studentName} ({mobileSignSlip.class})</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Guru Mapel:</span><span className="font-semibold text-amber-300">{mobileSignSlip.mapelTeacher || 'Guru Mapel'}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Perizinan:</span><span className="font-semibold text-indigo-300">{mobileSignSlip.type}</span></div>
                <div className="pt-1 text-slate-300"><strong className="block text-[10px] text-slate-400 uppercase">Alasan:</strong>{mobileSignSlip.reason}</div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1.5">Anda Bertindak Sebagai:</label>

                    <i className="fa-solid fa-chalkboard-user"></i> Guru Mapel
                  </button>
                  <button onClick={() => setMobileSignRole('guru_piket')} className={`py-2 px-3 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-1.5 ${mobileSignRole === 'guru_piket' ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                    <i className="fa-solid fa-user-shield"></i> Guru Piket / Ortum
                  </button>
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label className="text-xs font-bold text-slate-300">Bubuhkan Tanda Tangan Anda:</label>
                  <button onClick={clearSignatureCanvas} className="text-[11px] text-rose-400 hover:underline"><i className="fa-solid fa-rotate-left mr-1"></i>Bersihkan</button>

                <div className="bg-white rounded-2xl overflow-hidden border-2 border-indigo-500 shadow-inner">

                {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <><i className="fa-solid fa-paper-plane"></i><span>Kirim Tanda Tangan ke Aplikasi Piket</span></>}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          
          <header className="bg-indigo-700 text-white shadow-md no-print-element">

              <button onClick={() => setActiveTab('perizinan')} className={`py-3 px-4 font-semibold text-sm border-b-2 transition flex items-center gap-2 whitespace-nowrap ${activeTab === 'perizinan' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                <i className="fa-solid fa-ticket"></i> Perizinan

              <button onClick={() => setActiveTab('absensi')} className={`py-3 px-4 font-semibold text-sm border-b-2 transition flex items-center gap-2 whitespace-nowrap ${activeTab === 'absensi' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}><i className="fa-solid fa-clipboard-user"></i> Rekap Harian</button>
              <button onClick={() => setActiveTab('pesanOrtu')} className={`py-3 px-4 font-semibold text-sm border-b-2 transition flex items-center gap-2 whitespace-nowrap ${activeTab === 'pesanOrtu' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>

                <i className="fa-solid fa-file-pdf text-rose-500"></i> Download Rekap
              </button>
              <button onClick={() => setActiveTab('jurnal')} className={`py-3 px-4 font-semibold text-sm border-b-2 transition flex items-center gap-2 whitespace-nowrap ${activeTab === 'jurnal' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}><i className="fa-solid fa-book-journal-whills"></i> Jurnal Piket</button>
            </div>
          </nav>

                <div className="bg-slate-50 border-2 border-indigo-200 rounded-2xl overflow-hidden shadow-inner relative">
                  <canvas ref={directCanvasRef} width="380" height="180" className="w-full h-44 touch-none cursor-crosshair bg-white"></canvas>
                </div>
                <div className="flex justify-between items-center text-xs">
                  <button onClick={clearDirectCanvas} className="text-rose-600 hover:underline font-semibold cursor-pointer"><i className="fa-solid fa-rotate-left mr-1"></i>Hapus Pad</button>
                  <span className="text-[10px] text-slate-400">SI-PIKET Signature</span>
                </div>
                <div className="flex gap-3 pt-2">
                  <button type="button" onClick={() => setDirectSignRole(null)} className="w-1/2 py-2.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl cursor-pointer transition">Batal</button>
                  <button type="button" onClick={handleSaveDirectSignature} className="w-1/2 py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md cursor-pointer transition">Simpan Tanda Tangan</button>
                </div>
              </div>
            </div>
          )}

          {previewPermModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto no-print-element">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 shadow-2xl space-y-6 relative border border-slate-100 my-8">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="p-2 bg-indigo-50 text-indigo-600 rounded-xl text-sm"><i className="fa-solid fa-file-contract"></i></span>
                    <h3 className="font-extrabold text-slate-800 text-base">Surat Perizinan Siswa Resmi</h3>
                  </div>
                  <button onClick={() => setPreviewPermModal(null)} className="text-slate-400 hover:text-slate-600 p-1 cursor-pointer"><i className="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div className="border border-slate-200 rounded-2xl p-6 bg-slate-50/50 space-y-4 font-serif text-slate-800 text-xs sm:text-sm shadow-inner">
                  <div className="text-center border-b border-slate-300 pb-3">
                    <h2 className="font-extrabold text-slate-900 text-base uppercase tracking-wider">PEMERINTAH DAERAH DINAS PENDIDIKAN</h2>
                    <h3 className="font-bold text-indigo-900 text-sm">SMA NEGERI 1 PARUNG</h3>
                    <p className="text-[10px] text-slate-500 font-sans mt-0.5">Jl. Pendidikan No. 123, Telepon: (021) 555-0192</p>
                  </div>
                  <div className="text-center py-1">
                    <h4 className="font-bold underline text-sm uppercase">SURAT IZIN SISWA</h4>
                    <span className="font-mono text-xs text-slate-500">Nomor: {previewPermModal.slipNumber}</span>
                  </div>
                  <p className="leading-relaxed">Yang bertanda tangan di bawah ini, Guru Piket Sekolah memberikan izin kepada siswa:</p>
                  <table className="w-full text-xs my-2 font-sans">
                    <tbody>
                      <tr><td className="w-32 py-1 text-slate-500 font-medium">Nama Siswa</td><td className="w-4">:</td><td className="font-bold text-slate-900">{previewPermModal.studentName}</td></tr>
                      <tr><td className="py-1 text-slate-500 font-medium">NIS / Kelas</td><td>:</td><td className="font-semibold text-slate-800">{previewPermModal.nis} / {previewPermModal.class}</td></tr>
                      <tr><td className="py-1 text-slate-500 font-medium">Guru Mata Pelajaran</td><td>:</td><td className="font-semibold text-slate-800">{previewPermModal.mapelTeacher || 'Guru Mapel'}</td></tr>
                      <tr><td className="py-1 text-slate-500 font-medium">Jenis Perizinan</td><td>:</td><td><span className="px-2 py-0.5 bg-indigo-100 text-indigo-800 font-bold rounded-md text-[11px]">{previewPermModal.type}</span></td></tr>
                      <tr><td className="py-1 text-slate-500 font-medium">Waktu Izin</td><td>:</td><td className="font-semibold text-slate-800">{previewPermModal.time} WIB ({previewPermModal.date})</td></tr>
                      <tr><td className="py-1 text-slate-500 font-medium align-top">Alasan Izin</td><td className="align-top">:</td><td className="align-top font-sans text-slate-700">{previewPermModal.reason}</td></tr>
                    </tbody>
                  </table>
                  <div className="pt-4 border-t border-slate-200 space-y-4 font-sans">
                    <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
                      <div>
                        <p className="text-xs font-bold text-indigo-900">SCAN BARCODE HP UNTUK TANDA TANGAN DIGITAL:</p>
                        <p className="text-[10px] text-slate-500 mt-0.5">Arahkan kamera HP ke barcode untuk membuka lembar tanda tangan digital.</p>
                      </div>
                      <div id="qrcode-container" className="p-1.5 bg-white rounded-lg shadow-inner flex-shrink-0"></div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs pt-2">
                      <div className="space-y-1">
                        <p className="text-[11px] text-slate-500">Siswa / Orang Tua,</p>
                        <div className="h-16 flex items-center justify-center">
                          <div className="border border-dashed border-slate-300 rounded-lg px-2 py-1 bg-slate-50 text-[10px] text-slate-400">( Pemohon )</div>
                        </div>
                        <p className="font-bold text-slate-900 underline text-[11px] truncate">{previewPermModal.studentName ? previewPermModal.studentName.split(' ')[0] : 'Siswa'}</p>
                      </div>
                      <div className="space-y-1 flex flex-col items-center">
                        <p className="text-[11px] text-slate-500">Guru Mata Pelajaran,</p>
                        <div className="h-16 flex flex-col items-center justify-center w-full">
                          {previewPermModal.signatureMapel ? (
                            <img src={previewPermModal.signatureMapel} alt="TTD Mapel" className="max-h-16 border border-emerald-200 rounded-lg p-0.5 bg-white shadow-sm" />
                          ) : (
                            <div className="flex flex-col items-center gap-1">
                              <div className="border border-dashed border-amber-300 rounded-lg px-2 py-0.5 bg-amber-50 text-[10px] text-amber-700 font-semibold">Belum TTD</div>
                              <button type="button" onClick={() => setDirectSignRole({ role: 'guru_mapel', perm: previewPermModal })} className="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-md text-[10px] font-bold transition flex items-center gap-1 shadow-sm cursor-pointer"><i className="fa-solid fa-pen"></i> TTD Sekarang</button>
                            </div>
                          )}
                        </div>
                        <p className="font-bold text-slate-900 underline text-[11px] truncate">{previewPermModal.mapelTeacher || 'Guru Mapel'}</p>
                      </div>
                      <div className="space-y-1 flex flex-col items-center">
                        <p className="text-[11px] text-slate-500">Guru Piket Bertugas,</p>
                        <div className="h-16 flex flex-col items-center justify-center w-full">
                          {previewPermModal.signature ? (
                            <img src={previewPermModal.signature} alt="TTD Piket" className="max-h-16 border border-emerald-200 rounded-lg p-0.5 bg-white shadow-sm" />
                          ) : (
                            <div className="flex flex-col items-center gap-1">
                              <div className="border border-dashed border-amber-300 rounded-lg px-2 py-0.5 bg-amber-50 text-[10px] text-amber-700 font-semibold">Belum TTD</div>
                              <button type="button" onClick={() => setDirectSignRole({ role: 'guru_piket', perm: previewPermModal })} className="px-2 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-[10px] font-bold transition flex items-center gap-1 shadow-sm cursor-pointer"><i className="fa-solid fa-pen"></i> TTD Sekarang</button>
                            </div>
                          )}
                        </div>
                        <p className="font-bold text-slate-900 underline text-[11px] truncate">{previewPermModal.piketTeacher || selectedGuru}</p>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex flex-wrap gap-2 justify-end pt-2">
                  <button type="button" onClick={() => handleApprovePermission(previewPermModal.id)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer"><i className="fa-solid fa-circle-check"></i> Direct Approve</button>
                  <button type="button" onClick={() => triggerPrintSlip(previewPermModal)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer"><i className="fa-solid fa-print"></i> Cetak Struk / PDF</button>
                  <button type="button" onClick={() => setPreviewPermModal(null)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition cursor-pointer">Tutup</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL PRINT PREVIEW THERMAL 80mm */}
          {printPreviewModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto no-print-element">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 relative border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-print text-indigo-600"></i>
                    <h3 className="font-extrabold text-slate-800 text-sm">Pratinjau Struk Perizinan</h3>
                  </div>
                  <button onClick={() => setPrintPreviewModal(null)} className="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="bg-amber-50/50 p-4 border border-dashed border-amber-300 rounded-2xl font-mono text-xs text-slate-800 space-y-2">
                  <div className="text-center font-bold">
                    <p className="text-sm">SLIP IZIN SISWA</p>
                    <p className="text-[10px]">SMAN 1 PARUNG</p>
                    <p className="text-[10px] text-slate-400">--------------------------------</p>
                  </div>
                  
                  <div className="space-y-1 text-[11px]">
                    <div className="flex justify-between"><span className="text-slate-500">No. Slip:</span><span className="font-bold">{printPreviewModal.slipNumber}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Tanggal:</span><span>{printPreviewModal.date || ''}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Siswa:</span><span className="font-bold">{printPreviewModal.studentName}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">NIS/Kelas:</span><span>{printPreviewModal.nis} / {printPreviewModal.class}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Guru Mapel:</span><span>{printPreviewModal.mapelTeacher || 'Guru Mapel'}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Jenis Izin:</span><span className="font-bold text-indigo-700">{printPreviewModal.type}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Jam:</span><span>{printPreviewModal.time} WIB</span></div>
                    <div className="pt-1"><span className="text-slate-500 block">Alasan:</span><span>{printPreviewModal.reason}</span></div>
                  </div>

                  <div className="text-center text-[10px] text-slate-400 pt-1">--------------------------------</div>

                  <div className="grid grid-cols-3 gap-1 text-[9px] text-center pt-1">
                    <div>
                      <p>Siswa</p>
                      <p className="font-bold mt-4">({printPreviewModal.studentName ? printPreviewModal.studentName.split(' ')[0] : 'Siswa'})</p>
                    </div>
                    <div>
                      <p>Guru Mapel</p>
                      <p className="font-bold mt-4">({printPreviewModal.mapelTeacher ? printPreviewModal.mapelTeacher.split(' ')[0] : 'Mapel'})</p>
                    </div>
                    <div>
                      <p>Guru Piket</p>
                      <p className="font-bold mt-4">({printPreviewModal.piketTeacher ? printPreviewModal.piketTeacher.split(' ')[0] : selectedGuru.split(' ')[0]})</p>
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={executeBrowserPrint} className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-pointer">
                    <i className="fa-solid fa-print"></i> Cetak ke Printer / PDF
                  </button>
                  <button type="button" onClick={() => setPrintPreviewModal(null)} className="py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition cursor-pointer">
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AREA CETAK (HANYA DITAMPILKAN KE PRINTER OLEH CSS) */}
          {printPreviewModal && (
            <div id="print-section">
              <div style={{ textAlign: 'center', marginBottom: '8px' }}>
                <h2 style={{ fontSize: '13pt', margin: '0', fontWeight: 'bold' }}>SLIP IZIN SISWA</h2>
                <h3 style={{ fontSize: '10pt', margin: '2px 0 0 0' }}>SMAN 1 PARUNG</h3>
                <p style={{ fontSize: '8pt', margin: '2px 0' }}>----------------------------------</p>
              </div>
              <table style={{ width: '100%', fontSize: '8.5pt', borderCollapse: 'collapse' }}>
                <tbody>
                  <tr><td style={{ width: '30%', padding: '2px 0' }}>No. Slip</td><td style={{ width: '5%' }}>:</td><td style={{ fontWeight: 'bold' }}>{printPreviewModal.slipNumber}</td></tr>
                  <tr><td style={{ padding: '2px 0' }}>Tanggal</td><td>:</td><td>{printPreviewModal.date || ''}</td></tr>
                  <tr><td style={{ padding: '2px 0' }}>Siswa</td><td>:</td><td style={{ fontWeight: 'bold' }}>{printPreviewModal.studentName}</td></tr>
                  <tr><td style={{ padding: '2px 0' }}>NIS / Kelas</td><td>:</td><td>{printPreviewModal.nis} / {printPreviewModal.class}</td></tr>
                  <tr><td style={{ padding: '2px 0' }}>Guru Mapel</td><td>:</td><td>{printPreviewModal.mapelTeacher || 'Guru Mapel'}</td></tr>
                  <tr><td style={{ padding: '2px 0' }}>Jenis Izin</td><td>:</td><td style={{ fontWeight: 'bold' }}>{printPreviewModal.type}</td></tr>
                  <tr><td style={{ padding: '2px 0' }}>Waktu Izin</td><td>:</td><td>{printPreviewModal.time} WIB</td></tr>
                  <tr><td style={{ padding: '2px 0', verticalAlign: 'top' }}>Alasan</td><td style={{ verticalAlign: 'top' }}>:</td><td style={{ verticalAlign: 'top' }}>{printPreviewModal.reason}</td></tr>
                </tbody>
              </table>
              <p style={{ fontSize: '8pt', margin: '6px 0 2px 0', textAlign: 'center' }}>----------------------------------</p>
              
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '10px', fontSize: '7.5pt', textAlign: 'center' }}>
                <div style={{ width: '30%' }}>
                  <p style={{ margin: '0 0 5px 0' }}>Siswa,</p>
                  <div style={{ height: '30px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><span style={{ color: '#888' }}>( Pemohon )</span></div>
                  <p style={{ margin: '0', fontWeight: 'bold' }}>({printPreviewModal.studentName ? printPreviewModal.studentName.split(' ')[0] : 'Siswa'})</p>
                </div>
                <div style={{ width: '35%' }}>
                  <p style={{ margin: '0 0 5px 0' }}>Guru Mapel,</p>
                  <div style={{ height: '30px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    {printPreviewModal.signatureMapel ? <img src={printPreviewModal.signatureMapel} style={{ maxHeight: '28px' }} alt="TTD" /> : <span style={{ color: '#888' }}>(........)</span>}
                  </div>
                  <p style={{ margin: '0', fontWeight: 'bold' }}>({printPreviewModal.mapelTeacher ? printPreviewModal.mapelTeacher.split(' ')[0] : 'Mapel'})</p>
                </div>
                <div style={{ width: '35%' }}>
                  <p style={{ margin: '0 0 5px 0' }}>Guru Piket,</p>
                  <div style={{ height: '30px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    {printPreviewModal.signature ? <img src={printPreviewModal.signature} style={{ maxHeight: '28px' }} alt="TTD" /> : <span style={{ color: '#888' }}>(........)</span>}
                  </div>
                  <p style={{ margin: '0', fontWeight: 'bold' }}>({printPreviewModal.piketTeacher ? printPreviewModal.piketTeacher.split(' ')[0] : selectedGuru.split(' ')[0]})</p>
                </div>
              </div>
              <div style={{ textAlign: 'center', marginTop: '12px', fontSize: '7.5pt' }}><i>Simpan slip ini untuk ditunjukkan kepada Guru / Satpam.</i></div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
